
name: GameStatusMonitor

options:
  bundleIdPrefix: com.example

targets:
  GameStatusMonitor:
    type: application
    platform: iOS
    sources:
      - GameStatusMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GameStatusMonitor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

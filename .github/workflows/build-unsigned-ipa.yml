name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source ZIP
        run: |
          unzip -o GameStatusMonitor_iOS_Source.zip -d extracted

      - name: Configure project
        run: |
          export SOURCE_DIR="$(find extracted -type f -name 'GameStatusMonitorApp.swift' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR" || { echo "Không tìm thấy mã nguồn Swift"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("project.yml")
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*platform:)\s*$', r'\1 iOS', s)
          s = re.sub(
              r'(?m)^(\s*sources:\s*\n\s*-\s*).+$',
              lambda m: m.group(1) + os.environ["SOURCE_DIR"],
              s
          )
          p.write_text(s)
          PY

          cat project.yml
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project GameStatusMonitor.xcodeproj \
            -scheme GameStatusMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_KEY_CFBundleDisplayName=GameStatusMonitor \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "Không tìm thấy app đã build"; exit 1; }

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GameStatusMonitor-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStatusMonitor-unsigned-ipa
          path: GameStatusMonitor-unsigned.ipa
          if-no-files-found: error
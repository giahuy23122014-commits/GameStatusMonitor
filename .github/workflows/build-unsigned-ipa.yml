name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source ZIP
        run: |
          unzip -o GameStatusMonitor_iOS_Source.zip -d extracted
          echo "=== SOURCE FILES ==="
          find extracted -type f | head -100
          echo "=== SOURCE DIRECTORIES ==="
          find extracted -type d

      - name: Generate Xcode project
        run: |
          SOURCE_DIR="$(find extracted -type f -name 'GameStatusMonitorApp.swift' -print -quit | xargs dirname)"
          echo "Source directory: $SOURCE_DIR"
          test -n "$SOURCE_DIR" || { echo "Không tìm thấy mã nguồn Swift"; exit 1; }
          sed -i '' "s|      - .*|      - $SOURCE_DIR|" project.yml
          cat project.yml
          xcodegen generate --spec project.yml
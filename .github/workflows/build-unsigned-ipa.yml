name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source ZIP
        run: |
          unzip -o GameStatusMonitor_iOS_Source.zip -d extracted
          echo "=== SOURCE FILES ==="
          find extracted -type f | head -100
          echo "=== SOURCE DIRECTORIES ==="
          find extracted -type d

      - name: Generate Xcode project
        run: |
          export SOURCE_DIR="$(find extracted -type f -name 'GameStatusMonitorApp.swift' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR" || { echo "Không tìm thấy mã nguồn"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("project.yml")
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*platform:)\s*$', r'\1 iOS', s)
          s = re.sub(
              r'(?m)^(\s*sources:\s*\n\s*-\s*).+$',
              lambda m: m.group(1) + os.environ["SOURCE_DIR"],
              s
          )
          p.write_text(s)
          PY

          cat project.yml
          xcodegen generate --spec project.yml
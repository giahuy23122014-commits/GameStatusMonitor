name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f | sort

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Find project specification
        run: |
          SPEC="$(find . -name project.yml -not -path './.git/*' -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "ERROR: project.yml not found in repository"
            exit 1
          fi
          echo "Found: $SPEC"
          xcodegen generate --spec "$SPEC"

      - name: Find generated Xcode project
        run: |
          find . -name '*.xcodeproj' -print
